name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.11.19"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Ruff critical-error check
        run: >-
          uvx ruff check
          --output-format=github
          --select=E9,F63,F7,F82
          create_project.py tests core/scripts capabilities

  template-suite:
    name: Template suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          uv-version: ${{ env.UV_VERSION }}

      - name: Environment preflight
        run: python3 core/scripts/check_environment.py --profile node

      - name: Static integrity checks
        run: |
          git diff --check
          python3 -m compileall -q create_project.py tests core/scripts capabilities

      - name: Template deterministic test suite
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import unittest


          def escape_annotation(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )


          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)

          if result.wasSuccessful():
              raise SystemExit(0)

          failures = [*result.failures, *result.errors]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("### Template suite failure\n\n")
                  for test, traceback_text in failures:
                      summary.write(f"- `{test.id()}`\n")
                      summary.write("\n```text\n")
                      summary.write(traceback_text[-4000:])
                      summary.write("\n```\n")

          for test, traceback_text in failures:
              message = escape_annotation(traceback_text[-1800:])
              print(f"::error title={test.id()}::{message}")

          raise SystemExit(1)
          PY

  generated-project-smoke:
    name: Generated project smoke (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: generic
            capabilities: "[]"
          - profile: python
            capabilities: "[mutation-testing]"
          - profile: node
            capabilities: "[]"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          uv-version: ${{ env.UV_VERSION }}

      - name: Generate project and run full verification
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          project_id="ci-${{ matrix.profile }}-project"
          output_path="$tmpdir/$project_id"
          echo "PROJECT_DIR=$output_path" >> "$GITHUB_ENV"

          cat > "$tmpdir/project.yaml" <<YAML
          project_id: $project_id
          name: CI ${{ matrix.profile }} Project
          output_path: $output_path
          profile: ${{ matrix.profile }}
          capabilities: ${{ matrix.capabilities }}
          YAML

          python3 create_project.py --config "$tmpdir/project.yaml"
          cd "$output_path"
          python3 scripts/check_environment.py --profile "${{ matrix.profile }}"
          bash scripts/verify_full.sh

      - name: Upload generated project on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.profile }}
          path: ${{ env.PROJECT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - lint
      - template-suite
      - generated-project-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          tag_plain="${TAG_NAME#v}"

          # 1) Prefer a CHANGELOG section whose header mentions the tag.
          awk -v tag="$TAG_NAME" -v tagp="$tag_plain" '
            /^## / {
              if (capture) exit
              if (index($0, tag) || index($0, tagp)) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          # 2) Fallback: the most recent (top) section.
          if [ ! -s "$notes_file" ]; then
            awk '
              /^## / { sec++; if (sec == 1) next; if (sec > 1) exit }
              sec == 1 { print }
            ' CHANGELOG.md > "$notes_file"
          fi

          # 3) Fallback: the whole changelog.
          if [ ! -s "$notes_file" ]; then
            cp CHANGELOG.md "$notes_file"
          fi

          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          prerelease_flag=()
          if [[ "$TAG_NAME" == *internal* || "$TAG_NAME" == *alpha* || "$TAG_NAME" == *beta* || "$TAG_NAME" == *rc* ]]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "SpecForge SDD Template $TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              "${prerelease_flag[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "SpecForge SDD Template $TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              "${prerelease_flag[@]}"
          fi
